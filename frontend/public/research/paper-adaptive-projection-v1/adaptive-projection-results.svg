<text x="26" y="569" font-size="12">Vertical: whole-domain E2 reduction relative to newly adaptive PT. Negative observations remain visible. Horizontal: actual PT triangles N.</text>
<text x="26" y="596" font-size="12">PT and IT share the paper equation (2.18) edge decision; the new PT region priority generates its own full mesh.</text>
<text x="26" y="622" font-size="12">Stored XYZ/records count; independent PT planes need not be C0. Existing ruled models preserve C0 and their old topology and bytes.</text>
<text x="26" y="647" font-size="12">A finite local implementation, not author software, an optimality theorem, ground accuracy, RAM/GPU or ArcGIS software timing.</text></g></svg>
