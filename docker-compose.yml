services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: gugis
      POSTGRES_USER: gugis
      POSTGRES_PASSWORD: gugis
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./database/schema_postgis.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed_sample.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

  backend:
    image: python:3.11-slim
    working_dir: /app/backend
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      GUGIS_DATA_PATH: /app/backend/data/sample_gugis_objects.json

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgis-data:
