server {
    listen 8443 ssl;
    server_name 123.56.47.218;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/bristol-shop-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bristol-shop-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GugisTLS:5m;
    ssl_session_timeout 10m;
    root /opt/gugis/current/frontend/dist;
    index index.html;
    auth_basic "GUGIS3D demonstration";
    auth_basic_user_file /etc/nginx/gugis.htpasswd;
    client_max_body_size 128m;
    client_body_timeout 60s;
    send_timeout 90s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 3;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_max_temp_file_size 256m;
    }
    # Missing assets and scientific binaries must be 404, never the SPA HTML.
    location /assets/ { try_files $uri =404; expires 365d; }
    location /research/ { try_files $uri =404; expires 7d; }
    location /cesium/ { try_files $uri =404; expires 7d; }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }
    location / { try_files $uri $uri/ /index.html; }
}
